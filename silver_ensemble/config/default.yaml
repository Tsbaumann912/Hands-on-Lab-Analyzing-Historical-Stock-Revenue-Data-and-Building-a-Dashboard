# Standalone COMEX Silver (SI) ensemble CTA — independent of QuantTerminal.
contract:
  symbol: SI
  name: Silver
  yfinance_ticker: SI=F
  multiplier: 5000.0
  tick_size: 0.005
  tick_value: 25.00
  commission_per_contract: 2.25
  slippage_ticks: 1

ensemble:
  horizons_days: [21, 63, 126, 252]
  # Optuna-tuned weights (maximize avg calendar-year return, max DD < 30%)
  weights:
    tsmom: 0.266
    carry: 0.227
    basis_mom: 0.111
    inventory: 0.250
    fade: 0.146
  forecast_cap: 20.0
  agreement_min: 0.376
  fdm_cap: 1.801
  vol_target_annual: 0.093
  ewma_vol_com_days: 60
  fade_z: 2.554
  buffer_forecast: 3.402
  kelly_fraction: 0.246
  inventory_sma: 60
  inventory_delta_days: 20
  basis_mom_lookback: 63
  price_z_lookback: 20
  ratio_lookback: 63
  atr_period: 14
  stop_atr_mult: 2.382
  take_profit_atr_mult: 5.434

risk:
  max_daily_drawdown_pct: 0.29
  max_position_size_pct: 0.396
  max_leverage: 2.821
  max_contracts: 2500
  halt_on_breach: true

portfolio:
  # Institutional validation account ($350M AUM).
  initial_cash: 350000000.0

backtest:
  data_start: "2008-01-01"
  is_years: 3
  oos_years: 1
  step_years: 1
  purge_bars: 5
  walk_forward_windows: 4
  in_sample_ratio: 0.70

validation:
  dsr_pass_threshold: 0.95
  oos_retention_min: 0.60
  max_drawdown_gate: 0.30
  min_oos_sharpe: 0.0
  min_oos_cagr: 0.0
  min_oos_upi: 0.0
  require_both_modes: true

optimization:
  objective: maximize_avg_calendar_year_return
  constraint: max_drawdown < 0.30
  n_trials: 80
  search_space: config/optuna.yaml
