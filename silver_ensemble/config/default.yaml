# Standalone COMEX Silver (SI) ensemble CTA — independent of QuantTerminal.
contract:
  symbol: SI
  name: Silver
  yfinance_ticker: SI=F
  multiplier: 5000.0
  tick_size: 0.005
  tick_value: 25.00
  commission_per_contract: 2.25
  slippage_ticks: 1

ensemble:
  # Multi-horizon TSMOM including intermediate 126d (plan)
  horizons_days: [21, 63, 126, 252]
  weights:
    tsmom: 0.30
    carry: 0.25
    basis_mom: 0.20
    inventory: 0.15
    fade: 0.10
  forecast_cap: 20.0
  agreement_min: 0.40
  fdm_cap: 2.5
  vol_target_annual: 0.12
  ewma_vol_com_days: 60
  fade_z: 2.0
  buffer_forecast: 2.0
  kelly_fraction: 0.35
  inventory_sma: 60
  inventory_delta_days: 20
  basis_mom_lookback: 63
  price_z_lookback: 20
  ratio_lookback: 63
  atr_period: 14
  stop_atr_mult: 2.0
  take_profit_atr_mult: 4.0

risk:
  max_daily_drawdown_pct: 0.30
  max_position_size_pct: 0.50
  max_leverage: 5.0
  max_contracts: 2500
  halt_on_breach: true

portfolio:
  # Institutional validation account ($350M AUM).
  initial_cash: 350000000.0

backtest:
  data_start: "2008-01-01"
  is_years: 3
  oos_years: 1
  step_years: 1
  purge_bars: 5
  # Legacy block WFO (used by validate_ensemble ablation path)
  walk_forward_windows: 4
  in_sample_ratio: 0.70

validation:
  dsr_pass_threshold: 0.95
  oos_retention_min: 0.60
  max_drawdown_gate: 0.30
  min_oos_sharpe: 0.0
  min_oos_cagr: 0.0
  min_oos_upi: 0.0
  require_both_modes: true
