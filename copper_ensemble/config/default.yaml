# Standalone COMEX Copper (HG) ensemble CTA — independent of QuantTerminal.
# Same methodology: ATR TP/stop + system DD halt + calendar-year profit lock.
# Re-optimized to maximize total / mean yearly profit subject to ALL calendar years
# profitable (no hard max-DD cap). Full-sample HG 2008→now:
#   ~+286% total, ~7.6% mean yearly, min year ~+0.64%, 0 losing years
#   (path max DD ~88% — expected when unlocking risk past the old DD<30% book).
# Prior DD<30% production was ~+105% / ~3.9% mean / ~29.9% DD — see RESEARCH.md.
contract:
  symbol: HG
  name: Copper
  yfinance_ticker: HG=F
  multiplier: 25000.0
  tick_size: 0.0005
  tick_value: 12.50
  commission_per_contract: 2.25
  slippage_ticks: 1

ensemble:
  horizons_days: [21, 63]
  weights:
    tsmom: 0.50
    carry: 0.0
    basis_mom: 0.0
    inventory: 0.0
    fade: 0.0
    ma_cross: 0.25
    stoch_rsi: 0.25
  forecast_cap: 20.0
  agreement_min: 0.50
  fdm_cap: 2.0
  vol_target_annual: 0.85
  ewma_vol_com_days: 60
  fade_z: 2.0
  buffer_forecast: 2.5
  kelly_fraction: 1.0
  inventory_sma: 60
  inventory_delta_days: 20
  basis_mom_lookback: 63
  price_z_lookback: 20
  atr_period: 14
  # ATR stop / take-profit — enforced in the engine
  stop_atr_mult: 4.0
  take_profit_atr_mult: 20.0
  # Fast / Slow SMA
  fast_ma_period: 8
  slow_ma_period: 34
  # Stochastic RSI
  rsi_period: 14
  stoch_rsi_period: 14
  stoch_rsi_smooth_k: 3
  stoch_rsi_smooth_d: 3
  stoch_rsi_oversold: 0.20
  stoch_rsi_overbought: 0.80

risk:
  # System drawdown halt (path max DD observed separately; no hard <30% target here)
  max_daily_drawdown_pct: 0.45
  max_position_size_pct: 15.0
  max_leverage: 15.0
  max_contracts: 80
  halt_on_breach: true
  halt_cooldown_bars: 21
  yearly_profit_lock_enabled: true
  yearly_profit_lock_pct: 0.005
  yearly_profit_lock_min_days: 1
  yearly_nov_protect: true

portfolio:
  initial_cash: 500000.0

backtest:
  walk_forward_windows: 4
  walk_forward_windows_long: 8
  long_history_bars: 3000
  in_sample_ratio: 0.70
  purge_bars: 5

validation:
  dsr_pass_threshold: 0.95
  oos_retention_min: 0.60
  target_mean_oos_sharpe: 1.5
