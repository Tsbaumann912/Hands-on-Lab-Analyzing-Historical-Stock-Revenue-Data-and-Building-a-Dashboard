# Standalone COMEX Copper (HG) ensemble CTA — independent of QuantTerminal.
# Production ensemble selected by nested purged OOS among a tiny pre-specified
# candidate set (see RESEARCH.md). Fade disabled; longer TSMOM horizons.
contract:
  symbol: HG
  name: Copper
  yfinance_ticker: HG=F
  multiplier: 25000.0
  tick_size: 0.0005
  tick_value: 12.50
  commission_per_contract: 2.25
  slippage_ticks: 1

ensemble:
  # Longer horizons reduce short-noise; fade sleeve off (Yahoo PMI/USD are proxies).
  horizons_days: [63, 126, 252]
  weights:
    tsmom: 0.55
    carry: 0.16875
    basis_mom: 0.16875
    inventory: 0.1125
    fade: 0.0
  forecast_cap: 20.0
  agreement_min: 0.20
  fdm_cap: 2.0
  vol_target_annual: 0.15
  ewma_vol_com_days: 60
  fade_z: 2.0
  buffer_forecast: 1.0
  kelly_fraction: 0.40
  inventory_sma: 60
  inventory_delta_days: 20
  basis_mom_lookback: 63
  price_z_lookback: 20
  atr_period: 14
  stop_atr_mult: 2.0
  take_profit_atr_mult: 4.0

risk:
  # 3% was permanently killing multi-year backtests after one quiet loss streak.
  max_daily_drawdown_pct: 0.15
  max_position_size_pct: 0.50
  max_leverage: 5.0
  max_contracts: 20
  halt_on_breach: true

portfolio:
  # HG notional ≈ price × 25,000 (~$100k/contract at $4/lb); size for ≥1 lot.
  initial_cash: 500000.0

backtest:
  # Auto-bumped to 8 when series length ≥ 3000 bars (see validation.validate_ensemble).
  walk_forward_windows: 4
  walk_forward_windows_long: 8
  long_history_bars: 3000
  in_sample_ratio: 0.70
  purge_bars: 5

validation:
  dsr_pass_threshold: 0.95
  oos_retention_min: 0.60
  # Aspirational institutional CTA bar — single-name HG OOS WFA typically cannot clear this.
  target_mean_oos_sharpe: 1.5
