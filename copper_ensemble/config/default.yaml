# Standalone COMEX Copper (HG) ensemble CTA — independent of QuantTerminal.
# UPI dual-WFA winner (2008→now): G_ma_stoch_heavy
# (Fast/Slow MA + Stochastic RSI sleeves; max_position_size_pct = 5).
contract:
  symbol: HG
  name: Copper
  yfinance_ticker: HG=F
  multiplier: 25000.0
  tick_size: 0.0005
  tick_value: 12.50
  commission_per_contract: 2.25
  slippage_ticks: 1

ensemble:
  horizons_days: [63, 126, 252]
  weights:
    tsmom: 0.30
    carry: 0.08
    basis_mom: 0.08
    inventory: 0.06
    fade: 0.0
    ma_cross: 0.28
    stoch_rsi: 0.20
  forecast_cap: 20.0
  agreement_min: 0.20
  fdm_cap: 2.0
  vol_target_annual: 0.15
  ewma_vol_com_days: 60
  fade_z: 2.0
  buffer_forecast: 1.0
  kelly_fraction: 0.40
  inventory_sma: 60
  inventory_delta_days: 20
  basis_mom_lookback: 63
  price_z_lookback: 20
  atr_period: 14
  stop_atr_mult: 2.0
  take_profit_atr_mult: 4.0
  # Fast / Slow SMA
  fast_ma_period: 10
  slow_ma_period: 50
  # Stochastic RSI
  rsi_period: 14
  stoch_rsi_period: 14
  stoch_rsi_smooth_k: 3
  stoch_rsi_smooth_d: 3
  stoch_rsi_oversold: 0.20
  stoch_rsi_overbought: 0.80

risk:
  max_daily_drawdown_pct: 0.15
  max_position_size_pct: 5.0
  max_leverage: 5.0
  max_contracts: 20
  halt_on_breach: true
  halt_cooldown_bars: 21

portfolio:
  initial_cash: 500000.0

backtest:
  walk_forward_windows: 4
  walk_forward_windows_long: 8
  long_history_bars: 3000
  in_sample_ratio: 0.70
  purge_bars: 5

validation:
  dsr_pass_threshold: 0.95
  oos_retention_min: 0.60
  target_mean_oos_sharpe: 1.5
